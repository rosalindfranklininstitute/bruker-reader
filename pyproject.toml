[project]
name = "bruker-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "McDougall", email = "Duncan.McDougall@rfi.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "hdf5plugin>=6.0.0",
    "icecream>=2.2.0",
    "pytdfsdk",
    "sparse>=0.18.0",
    "tqdm>=4.67.3",
    "argsui[gui]>=0.3.6",
    "xartus>=0.4.3",
]


[dependency-groups]
dev = [
    "line-profiler>=5.0.1",
    "pre-commit>=4.7.0",
    "pyinstaller>=6.22.3",
    "snakeviz>=2.2.2",
]
tmp = [
    "bokeh>=3.10.0",
    "matplotlib>=3.10.8",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
main = "bruker_reader:main"
query = "bruker_reader:query_data"
scratch = "bruker_reader:scratch"
tof = "bruker_reader:tof"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
xartus = { path = "../Xartus", editable = true }
pytdfsdk = { path = "../pyTDFSDK", editable = true }

[tool.ruff.lint]
ignore=['RUF009']

[tool.line_profiler.kernprof]
line-by-line = true
verbose = false
skip-zero = true
prof-mod = ['./src/bruker_reader/', 'bruker_reader', '../xartus/src/xartus/', 'xartus', './tmp.py']
prof-imports = false
